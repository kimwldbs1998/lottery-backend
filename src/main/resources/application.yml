server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cenlottery}
    username: ${DB_USER:cenlottery}
    password: ${DB_PASSWORD:cenlottery}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  admin-key: ${ADMIN_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    expiry-ms: 43200000 # 12 hours
